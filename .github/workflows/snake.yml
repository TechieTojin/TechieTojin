name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TechieTojin
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#F8FAFC,#DBEAFE,#93C5FD,#3B82F6,#2563EB
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#1E293B,#1E3A5F,#2563EB,#4F46E5,#7C3AED

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
