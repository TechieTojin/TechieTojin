<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.5" stop-color="#111D35"/>
      <stop offset="1" stop-color="#162044"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="400" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="380" cy="80" r="140" fill="url(#orb1)"/>
  <circle cx="80" cy="340" r="120" fill="url(#orb2)"/>

  <!-- Floating surface (decorative, small) -->
  <rect x="320" y="40" width="130" height="80" rx="10" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.6"/>
  <rect x="335" y="55" width="50" height="6" rx="3" fill="#3B82F6" opacity="0.4"/>
  <rect x="335" y="68" width="90" height="4" rx="2" fill="#334155"/>
  <rect x="335" y="78" width="70" height="4" rx="2" fill="#334155"/>
  <rect x="335" y="92" width="40" height="14" rx="5" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="0.5"/>

  <!-- Name -->
  <text x="30" y="160" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">TOJIN</text>
  <text x="30" y="210" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">VARKEY</text>
  <text x="30" y="260" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">SIMSON</text>

  <!-- Accent bar -->
  <rect x="30" y="275" width="70" height="3" rx="1.5" fill="url(#accent-line)"/>

  <!-- Role -->
  <text x="30" y="305" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="500">Software Engineer</text>

  <!-- Tagline -->
  <text x="30" y="335" fill="#64748B" font-family="system-ui, sans-serif" font-size="16">Building reliable products, intelligent</text>
  <text x="30" y="355" fill="#64748B" font-family="system-ui, sans-serif" font-size="16">systems, and seamless experiences.</text>

  <!-- Company pill -->
  <rect x="30" y="372" width="180" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.6"/>
  <text x="120" y="389" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Simplify3x · Bengaluru</text>
</svg>
