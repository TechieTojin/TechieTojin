<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.4" stop-color="#0C1525"/>
      <stop offset="1" stop-color="#111D35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow-bl" cx="0.3" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tr" cx="0.75" cy="0.15" r="0.4">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card1-clip"><rect x="270" y="30" width="190" height="130" rx="10"/></clipPath>
    <clipPath id="card2-clip"><rect x="290" y="180" width="170" height="105" rx="10"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="480" height="380" fill="url(#bg)"/>
  <rect width="480" height="380" fill="url(#glow-bl)"/>
  <rect width="480" height="380" fill="url(#glow-tr)"/>

  <!-- Fine grid (subtle depth) -->
  <g stroke="#1E293B" stroke-width="0.3" opacity="0.3">
    <line x1="0" y1="95" x2="480" y2="95"/>
    <line x1="0" y1="190" x2="480" y2="190"/>
    <line x1="0" y1="285" x2="480" y2="285"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
  </g>

  <!-- Glass card 1: product module -->
  <g clip-path="url(#card1-clip)">
    <rect x="270" y="30" width="190" height="130" rx="10" fill="url(#glass1)" stroke="#2D3B54" stroke-width="0.6"/>
    <!-- Window chrome dots -->
    <circle cx="286" cy="46" r="3" fill="#EF4444" opacity="0.6"/>
    <circle cx="296" cy="46" r="3" fill="#F59E0B" opacity="0.6"/>
    <circle cx="306" cy="46" r="3" fill="#22C55E" opacity="0.6"/>
    <!-- Content lines -->
    <rect x="286" y="62" width="60" height="7" rx="3.5" fill="#3B82F6" opacity="0.35"/>
    <rect x="286" y="78" width="120" height="5" rx="2.5" fill="#334155"/>
    <rect x="286" y="90" width="100" height="5" rx="2.5" fill="#334155"/>
    <rect x="286" y="102" width="140" height="5" rx="2.5" fill="#334155"/>
    <!-- Mini chart -->
    <polyline points="286,138 305,128 324,132 343,120 362,124 381,115 400,118 419,108 438,112" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.5"/>
    <rect x="286" y="118" width="160" height="1" fill="#1E293B"/>
  </g>

  <!-- Glass card 2: API module -->
  <g clip-path="url(#card2-clip)">
    <rect x="290" y="180" width="170" height="105" rx="10" fill="url(#glass2)" stroke="#2D3B54" stroke-width="0.6"/>
    <!-- Status indicators -->
    <circle cx="312" cy="202" r="5" fill="none" stroke="#22C55E" stroke-width="1.2" opacity="0.7"/>
    <circle cx="312" cy="202" r="2" fill="#22C55E" opacity="0.7"/>
    <rect x="326" y="198" width="80" height="5" rx="2.5" fill="#334155"/>

    <circle cx="312" cy="222" r="5" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <circle cx="312" cy="222" r="2" fill="#3B82F6" opacity="0.7"/>
    <rect x="326" y="218" width="100" height="5" rx="2.5" fill="#334155"/>

    <circle cx="312" cy="242" r="5" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.7"/>
    <circle cx="312" cy="242" r="2" fill="#7C3AED" opacity="0.7"/>
    <rect x="326" y="238" width="70" height="5" rx="2.5" fill="#334155"/>

    <!-- Code hint -->
    <rect x="306" y="260" width="30" height="12" rx="3" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="0.5" opacity="0.6"/>
    <rect x="342" y="260" width="45" height="12" rx="3" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Connector line between cards -->
  <path d="M 365 160 C 365 170, 375 170, 375 180" stroke="#2D3B54" stroke-width="0.8" fill="none"/>
  <circle cx="365" cy="160" r="2" fill="#3B82F6" opacity="0.4"/>
  <circle cx="375" cy="180" r="2" fill="#7C3AED" opacity="0.4"/>

  <!-- Name -->
  <text x="28" y="115" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">TOJIN</text>
  <text x="28" y="162" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">VARKEY</text>
  <text x="28" y="209" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">SIMSON</text>

  <!-- Accent bar -->
  <rect x="28" y="222" width="70" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Role & tagline -->
  <text x="28" y="252" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Software Engineer</text>
  <text x="28" y="278" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">Building reliable products, intelligent</text>
  <text x="28" y="296" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">systems, and seamless experiences.</text>

  <!-- Company + location -->
  <text x="28" y="335" fill="#475569" font-family="system-ui, sans-serif" font-size="13">Simplify3x Software · Bengaluru, India</text>

  <!-- Bottom accent line -->
  <rect x="0" y="376" width="480" height="4" fill="url(#accent)" opacity="0.15"/>
</svg>
