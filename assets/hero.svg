<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#30363d"/>
      <stop offset="0.8" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.4">
    <line x1="120" y1="0" x2="120" y2="520"/>
    <line x1="240" y1="0" x2="240" y2="520"/>
    <line x1="360" y1="0" x2="360" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="720" y1="0" x2="720" y2="520"/>
    <line x1="840" y1="0" x2="840" y2="520"/>
    <line x1="0" y1="130" x2="960" y2="130"/>
    <line x1="0" y1="260" x2="960" y2="260"/>
    <line x1="0" y1="390" x2="960" y2="390"/>
  </g>

  <!-- Accent geometric: abstract node graph -->
  <g opacity="0.12">
    <circle cx="680" cy="120" r="60" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <circle cx="820" cy="200" r="40" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <circle cx="750" cy="320" r="50" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <circle cx="860" cy="380" r="30" stroke="#58a6ff" stroke-width="1" fill="none"/>
    <line x1="680" y1="180" x2="750" y2="270" stroke="#58a6ff" stroke-width="0.8"/>
    <line x1="820" y1="240" x2="750" y2="270" stroke="#58a6ff" stroke-width="0.8"/>
    <line x1="750" y1="370" x2="860" y2="380" stroke="#58a6ff" stroke-width="0.8"/>
    <circle cx="680" cy="120" r="4" fill="#58a6ff"/>
    <circle cx="820" cy="200" r="3" fill="#58a6ff"/>
    <circle cx="750" cy="320" r="4" fill="#58a6ff"/>
    <circle cx="860" cy="380" r="3" fill="#58a6ff"/>
  </g>

  <!-- Coordinate labels -->
  <text x="40" y="30" fill="#30363d" font-family="monospace" font-size="10">48.5°N 77.6°E</text>
  <text x="860" y="510" fill="#30363d" font-family="monospace" font-size="10">BENGALURU</text>

  <!-- Main typography -->
  <text x="60" y="200" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-2">TOJIN VARKEY</text>
  <text x="60" y="265" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-2">SIMSON</text>

  <!-- Accent line -->
  <rect x="60" y="290" width="80" height="3" rx="1.5" fill="#58a6ff"/>

  <!-- Role -->
  <text x="60" y="330" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="3">SOFTWARE ENGINEER</text>

  <!-- Description -->
  <text x="60" y="370" fill="#6e7681" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Product engineering across client, service, and data.</text>
  <text x="60" y="392" fill="#6e7681" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Full-stack · Mobile · AI systems · Production reliability.</text>

  <!-- Company tag -->
  <rect x="60" y="420" width="160" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="439" fill="#8b949e" font-family="monospace" font-size="11">@ Simplify3x</text>

  <!-- Divider bottom -->
  <rect x="0" y="517" width="960" height="3" fill="url(#line-fade)"/>
</svg>
