<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="400" fill="url(#bg)"/>
  <rect width="480" height="400" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Fine engineering grid -->
  <g stroke="#F1F5F9" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
  </g>

  <!-- Code editor surface (top right) -->
  <rect x="280" y="28" width="176" height="140" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="280" y="28" width="176" height="24" rx="8" fill="#F8FAFC"/>
  <rect x="280" y="44" width="176" height="8" fill="#F8FAFC"/>
  <circle cx="296" cy="40" r="3" fill="#FCA5A5"/>
  <circle cx="306" cy="40" r="3" fill="#FDE68A"/>
  <circle cx="316" cy="40" r="3" fill="#86EFAC"/>
  <!-- Code lines -->
  <rect x="296" y="62" width="28" height="5" rx="2" fill="#2563EB" opacity="0.2"/>
  <rect x="328" y="62" width="50" height="5" rx="2" fill="#0F172A" opacity="0.12"/>
  <rect x="296" y="74" width="16" height="5" rx="2" fill="#7C3AED" opacity="0.2"/>
  <rect x="316" y="74" width="70" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="296" y="86" width="40" height="5" rx="2" fill="#0F172A" opacity="0.1"/>
  <rect x="340" y="86" width="60" height="5" rx="2" fill="#16A34A" opacity="0.2"/>
  <rect x="296" y="98" width="20" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="296" y="114" width="55" height="5" rx="2" fill="#2563EB" opacity="0.15"/>
  <rect x="355" y="114" width="35" height="5" rx="2" fill="#0F172A" opacity="0.1"/>
  <rect x="296" y="126" width="80" height="5" rx="2" fill="#0F172A" opacity="0.06"/>
  <rect x="296" y="138" width="32" height="5" rx="2" fill="#7C3AED" opacity="0.15"/>
  <rect x="332" y="138" width="48" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <!-- Line numbers -->
  <text x="288" y="67" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">1</text>
  <text x="288" y="79" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">2</text>
  <text x="288" y="91" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">3</text>
  <text x="288" y="103" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">4</text>
  <text x="288" y="119" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">5</text>
  <text x="288" y="131" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">6</text>
  <text x="288" y="143" fill="#CBD5E1" font-family="monospace" font-size="6" text-anchor="end">7</text>

  <!-- Terminal surface (bottom right) -->
  <rect x="300" y="190" width="156" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="300" y="190" width="156" height="20" rx="8" fill="#F8FAFC"/>
  <rect x="300" y="202" width="156" height="8" fill="#F8FAFC"/>
  <text x="316" y="204" fill="#94A3B8" font-family="monospace" font-size="7">terminal</text>
  <text x="316" y="224" fill="#16A34A" font-family="monospace" font-size="8">$</text>
  <text x="328" y="224" fill="#475569" font-family="monospace" font-size="8">npm run build</text>
  <text x="316" y="238" fill="#94A3B8" font-family="monospace" font-size="7">✓ compiled successfully</text>
  <text x="316" y="252" fill="#16A34A" font-family="monospace" font-size="8">$</text>
  <text x="328" y="252" fill="#475569" font-family="monospace" font-size="8">npm test</text>
  <text x="316" y="266" fill="#94A3B8" font-family="monospace" font-size="7">Tests: 47 passed, 0 failed</text>
  <!-- Blinking cursor -->
  <rect x="316" y="276" width="5" height="8" fill="#2563EB" opacity="0.6"/>

  <!-- Connector between surfaces -->
  <path d="M 368 168 C 368 178, 378 180, 378 190" stroke="#E2E8F0" stroke-width="1" fill="none"/>
  <circle cx="368" cy="168" r="2.5" fill="#2563EB" opacity="0.3"/>
  <circle cx="378" cy="190" r="2.5" fill="#16A34A" opacity="0.3"/>

  <!-- Name -->
  <text x="24" y="118" fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">TOJIN</text>
  <text x="24" y="164" fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">VARKEY</text>
  <text x="24" y="210" fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SIMSON</text>

  <!-- Accent bar -->
  <rect x="24" y="224" width="60" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Role -->
  <text x="24" y="254" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Software Engineer</text>

  <!-- Tagline -->
  <text x="24" y="280" fill="#475569" font-family="system-ui, sans-serif" font-size="14">Building reliable software, intelligent</text>
  <text x="24" y="298" fill="#475569" font-family="system-ui, sans-serif" font-size="14">systems, and thoughtful experiences.</text>

  <!-- Company -->
  <text x="24" y="335" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Simplify3x Software · Bengaluru, India</text>

  <!-- Coordinate detail -->
  <text x="456" y="390" fill="#E2E8F0" font-family="monospace" font-size="8" text-anchor="end">12.97°N 77.59°E</text>

  <!-- Bottom accent -->
  <rect x="0" y="397" width="480" height="3" fill="url(#accent)" opacity="0.1"/>
</svg>
