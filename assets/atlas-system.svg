<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" fill="none">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="480" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111D35"/>
    </linearGradient>
    <linearGradient id="aline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="480" height="440" rx="12" fill="url(#abg)" stroke="#1E293B" stroke-width="1"/>

  <!-- Title -->
  <text x="24" y="38" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Atlas</text>
  <text x="24" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">AI Research Infrastructure</text>
  <rect x="24" y="68" width="50" height="3" rx="1.5" fill="url(#aline)"/>

  <!-- Pipeline steps — full width rows -->
  <g font-family="system-ui, sans-serif">
    <!-- Step 1 -->
    <rect x="24" y="88" width="432" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.6"/>
    <circle cx="52" cy="110" r="12" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="52" y="114" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="74" y="106" fill="#F1F5F9" font-size="16" font-weight="600">Planning</text>
    <text x="74" y="120" fill="#64748B" font-size="12">Break research question into sub-tasks</text>

    <!-- Arrow -->
    <text x="240" y="148" fill="#334155" font-size="16" text-anchor="middle">↓</text>

    <!-- Step 2 -->
    <rect x="24" y="155" width="432" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.6"/>
    <circle cx="52" cy="177" r="12" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="52" y="181" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="74" y="173" fill="#F1F5F9" font-size="16" font-weight="600">Evidence</text>
    <text x="74" y="187" fill="#64748B" font-size="12">Gather sources with citation provenance</text>

    <text x="240" y="215" fill="#334155" font-size="16" text-anchor="middle">↓</text>

    <!-- Step 3 -->
    <rect x="24" y="222" width="432" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.6"/>
    <circle cx="52" cy="244" r="12" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <text x="52" y="248" fill="#8B5CF6" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="74" y="240" fill="#F1F5F9" font-size="16" font-weight="600">Critique</text>
    <text x="74" y="254" fill="#64748B" font-size="12">Validate claims against sources</text>

    <text x="240" y="282" fill="#334155" font-size="16" text-anchor="middle">↓</text>

    <!-- Step 4 -->
    <rect x="24" y="289" width="432" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.6"/>
    <circle cx="52" cy="311" r="12" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="52" y="315" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="74" y="307" fill="#F1F5F9" font-size="16" font-weight="600">Synthesis</text>
    <text x="74" y="321" fill="#64748B" font-size="12">Compose findings into structured output</text>

    <text x="240" y="349" fill="#334155" font-size="16" text-anchor="middle">↓</text>

    <!-- Step 5 — final -->
    <rect x="24" y="356" width="432" height="44" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
    <circle cx="52" cy="378" r="12" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1"/>
    <text x="52" y="382" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle">✦</text>
    <text x="74" y="374" fill="#F1F5F9" font-size="16" font-weight="600">Knowledge Graph</text>
    <text x="74" y="388" fill="#64748B" font-size="12">Persistent, navigable, cross-run comparable</text>
  </g>

  <!-- Tech footer -->
  <text x="24" y="425" fill="#475569" font-family="system-ui, sans-serif" font-size="11">React · TypeScript · Python · FastAPI · LangGraph · Ollama · SQLite</text>
  <text x="456" y="425" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">private project</text>
</svg>
