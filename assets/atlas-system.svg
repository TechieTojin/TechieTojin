<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none">
  <rect width="480" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Title area -->
  <text x="24" y="36" fill="#0F172A" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Atlas</text>
  <text x="80" y="36" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">AI Research Infrastructure</text>
  <rect x="24" y="48" width="40" height="2.5" rx="1.25" fill="#2563EB"/>

  <!-- Pipeline -->
  <g font-family="system-ui, sans-serif">
    <!-- Step 1 -->
    <rect x="24" y="68" width="432" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="52" cy="89" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="52" y="93" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="74" y="85" fill="#0F172A" font-size="15" font-weight="600">Planning</text>
    <text x="74" y="99" fill="#64748B" font-size="11">Decompose research question into sub-tasks</text>

    <text x="240" y="124" fill="#CBD5E1" font-size="14" text-anchor="middle">↓</text>

    <!-- Step 2 -->
    <rect x="24" y="130" width="432" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="52" cy="151" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="52" y="155" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="74" y="147" fill="#0F172A" font-size="15" font-weight="600">Evidence</text>
    <text x="74" y="161" fill="#64748B" font-size="11">Gather sources with citation provenance</text>

    <text x="240" y="186" fill="#CBD5E1" font-size="14" text-anchor="middle">↓</text>

    <!-- Step 3 -->
    <rect x="24" y="192" width="432" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="52" cy="213" r="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="52" y="217" fill="#7C3AED" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="74" y="209" fill="#0F172A" font-size="15" font-weight="600">Critique</text>
    <text x="74" y="223" fill="#64748B" font-size="11">Validate each claim against its source</text>

    <text x="240" y="248" fill="#CBD5E1" font-size="14" text-anchor="middle">↓</text>

    <!-- Step 4 -->
    <rect x="24" y="254" width="432" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="52" cy="275" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="52" y="279" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="74" y="271" fill="#0F172A" font-size="15" font-weight="600">Synthesis</text>
    <text x="74" y="285" fill="#64748B" font-size="11">Compose findings into structured output</text>

    <text x="240" y="310" fill="#CBD5E1" font-size="14" text-anchor="middle">↓</text>

    <!-- Step 5 — final -->
    <rect x="24" y="316" width="432" height="42" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/>
    <circle cx="52" cy="337" r="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="1.2"/>
    <text x="52" y="341" fill="#2563EB" font-size="11" font-weight="700" text-anchor="middle">✦</text>
    <text x="74" y="333" fill="#0F172A" font-size="15" font-weight="600">Knowledge Graph</text>
    <text x="74" y="347" fill="#64748B" font-size="11">Persistent, navigable, cross-run comparable</text>
  </g>

  <!-- Feedback loop hint -->
  <path d="M 180 316 L 180 376 L 52 376 L 52 358" stroke="#E2E8F0" stroke-width="0.8" fill="none" stroke-dasharray="3 2"/>
  <text x="116" y="390" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">retry on validation failure</text>

  <!-- Footer -->
  <text x="24" y="412" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">React · TypeScript · Python · FastAPI · LangGraph · Ollama · SQLite</text>
  <text x="456" y="412" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">private project</text>
</svg>
