    <text x="70" y="143" fill="#E2E8F0" font-size="15" font-weight="600">Evidence</text>
    <text x="70" y="156" fill="#94A3B8" font-size="11">Gather sources with citation provenance</text>

    <text x="240" y="180" fill="#334155" font-size="14" text-anchor="middle">↓</text>

    <rect x="24" y="186" width="432" height="40" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="50" cy="206" r="10" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
