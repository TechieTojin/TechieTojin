    <text x="70" y="203" fill="#E2E8F0" font-size="15" font-weight="600">Critique</text>
    <text x="70" y="216" fill="#94A3B8" font-size="11">Validate claims against sources</text>

    <text x="240" y="240" fill="#334155" font-size="14" text-anchor="middle">↓</text>

    <rect x="24" y="246" width="432" height="40" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="50" cy="266" r="10" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="50" y="270" fill="#3B82F6" font-size="12" font-weight="700" text-anchor="middle">4</text>
