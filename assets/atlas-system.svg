      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0C1525"/>
    </linearGradient>
    <linearGradient id="aline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
